# k6-infer.yaml — change RATE between runs
apiVersion: batch/v1
kind: Job
metadata:
  name: k6-infer
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: k6
          image: grafana/k6:latest
          args: ["run", "-e", "URL=http://fake-infer/predict", "-e", "PAYLOAD=/scripts/payload.json",
                 "-e", "RATE=60", "-e", "DURATION=4m", "-e", "P95=1000", "/scripts/load.js"]
          volumeMounts:
            - {name: scripts, mountPath: /scripts}
      volumes:
        - name: scripts
          configMap: {name: k6-infer}
