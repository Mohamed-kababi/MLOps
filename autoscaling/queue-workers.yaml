apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
spec:
  selector:
    matchLabels: {app: redis}
  template:
    metadata:
      labels: {app: redis}
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis
spec:
  selector: {app: redis}
  ports:
    - port: 6379
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: worker-code
data:
  worker.py: |
    import os, signal, time
    import redis

    r = redis.Redis(host="redis", decode_responses=True)
    job_seconds = float(os.getenv("JOB_SECONDS", "0.5"))
    running = True

    def stop(*_):
        global running
        running = False          # finish the current job, then exit

    signal.signal(signal.SIGTERM, stop)

    while running:
        # reliable queue: the job moves to a processing list, not into thin air
        job = r.blmove("inference-jobs", "inference-processing", 5, "LEFT", "RIGHT")
        if job is None:
            continue
        time.sleep(job_seconds)          # stand-in for batch inference
        r.lrem("inference-processing", 1, job)
        r.incr("inference-done")
        print("done", job, flush=True)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: batch-worker
spec:
  replicas: 0
  selector:
    matchLabels: {app: batch-worker}
  template:
    metadata:
      labels: {app: batch-worker}
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker
          image: python:3.12-slim
          command: ["sh", "-c", "pip install --no-cache-dir -q 'redis==5.*' && python /code/worker.py"]
          resources:
            requests: {cpu: 100m, memory: 64Mi}
          volumeMounts:
            - {name: code, mountPath: /code}
      volumes:
        - name: code
          configMap: {name: worker-code}
