apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: batch-worker
spec:
  scaleTargetRef:
    name: batch-worker
  minReplicaCount: 0
  maxReplicaCount: 5
  pollingInterval: 10
  cooldownPeriod: 60               # seconds of empty queue before going to zero
  triggers:
    - type: redis
      metadata:
        address: redis.default.svc.cluster.local:6379
        listName: inference-jobs
        listLength: "20"           # target jobs waiting per worker
        activationListLength: "0"  # wake from zero on the first job
