# The one manual apply: after this, Argo CD is the only writer to the cluster.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: model-serving
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Mohamed-kababi/mlops-gitops
    targetRevision: main
    path: serving
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated: {prune: true, selfHeal: true}
