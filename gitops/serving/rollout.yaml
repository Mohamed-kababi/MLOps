# The training DAG edits exactly three lines here: MODEL_VERSION, MODEL_URI and the model-version argument.
# Before the first sync, set all three to your current champion version from the MLflow UI.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: model-server
spec:
  replicas: 4
  revisionHistoryLimit: 3
  selector:
    matchLabels: {app: model-server}
  template:
    metadata:
      labels: {app: model-server}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics/
    spec:
      containers:
        - name: server
          image: python:3.12-slim
          command: ["sh", "-c"]
          args:
            - >
              pip install --no-cache-dir -q "mlflow-skinny==2.16.2" "scikit-learn==1.5.2" "pandas==2.2.3"
              "fastapi==0.115.*" "uvicorn==0.32.*" "prometheus-client==0.21.*" &&
              uvicorn app:app --host 0.0.0.0 --port 8080 --app-dir /code
          env:
            - name: MODEL_VERSION
              value: "1"
            - name: MODEL_URI
              value: "models:/cancer-classifier/1"
            - name: MLFLOW_TRACKING_URI
              value: http://mlflow-host:5000
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /healthz, port: 8080}
            initialDelaySeconds: 20
            periodSeconds: 5
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 512Mi}
          volumeMounts:
            - {name: code, mountPath: /code}
      volumes:
        - name: code
          configMap: {name: model-server-code}
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause: {duration: 60s}
        - analysis:
            templates: [{templateName: model-canary}]
            args:
              - {name: canary-hash, valueFrom: {podTemplateHashValue: Latest}}
              - {name: stable-hash, valueFrom: {podTemplateHashValue: Stable}}
        - setWeight: 50
        - pause: {duration: 60s}
        - analysis:
            templates: [{templateName: model-canary}]
            args:
              - {name: canary-hash, valueFrom: {podTemplateHashValue: Latest}}
              - {name: stable-hash, valueFrom: {podTemplateHashValue: Stable}}
        - setWeight: 100
        - analysis:
            templates: [{templateName: promote-in-registry}]
            args:
              - name: model-version
                value: "1"
