services:
  drift-exporter:
    image: python:3.12-slim
    command: >
      sh -c "pip install --no-cache-dir -q 'evidently>=0.7' 'scikit-learn==1.5.2' pandas 'prometheus-client==0.21.*'
             'mlflow-skinny==2.16.2' boto3 &&
             python -u /app/exporter.py"
    environment:
      WINDOW: "300"
      INTERVAL_SECONDS: "30"
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MLFLOW_S3_ENDPOINT_URL: http://minio:9000
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin
    volumes:
      - ./exporter.py:/app/exporter.py:ro
      - ./control:/control
    ports:
      - "8000:8000"

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./rules.yml:/etc/prometheus/rules.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # lab only
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/ds.yml:ro
    ports:
      - "3000:3000"

# join the platform network so the exporter can reach MLflow and MinIO
networks:
  default:
    name: mlops
    external: true
