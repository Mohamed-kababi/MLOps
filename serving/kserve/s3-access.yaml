apiVersion: v1
kind: Secret
metadata:
  name: minio-s3
  annotations:
    serving.kserve.io/s3-endpoint: minio.default:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: minioadmin
  AWS_SECRET_ACCESS_KEY: minioadmin
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-s3
secrets:
  - name: minio-s3
