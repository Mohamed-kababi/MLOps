apiVersion: batch/v1
kind: Job
metadata:
  name: model-seeder
spec:
  backoffLimit: 2
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: python:3.12-slim
          env:
            - {name: AWS_ACCESS_KEY_ID, value: minioadmin}
            - {name: AWS_SECRET_ACCESS_KEY, value: minioadmin}
            - {name: S3_ENDPOINT, value: "http://minio:9000"}
          command: ["sh", "-c"]
          args:
            - |
              pip install --no-cache-dir -q mlflow-skinny==2.16.2 scikit-learn==1.5.2 pandas==2.2.3 boto3 &&
              python - <<'EOF'
              import json, os, boto3, mlflow.sklearn
              from mlflow.models import infer_signature
              from sklearn.datasets import load_breast_cancer
              from sklearn.ensemble import RandomForestClassifier

              X, y = load_breast_cancer(return_X_y=True, as_frame=True)
              m = RandomForestClassifier(n_estimators=200, max_depth=8, random_state=42).fit(X, y)
              mlflow.sklearn.save_model(m, "/tmp/model", signature=infer_signature(X, m.predict(X)))

              s3 = boto3.client("s3", endpoint_url=os.environ["S3_ENDPOINT"])
              try:
                  s3.create_bucket(Bucket="models")
              except s3.exceptions.BucketAlreadyOwnedByYou:
                  pass
              for root, _, files in os.walk("/tmp/model"):
                  for f in files:
                      p = os.path.join(root, f)
                      s3.upload_file(p, "models", "cancer-classifier/v1/" + os.path.relpath(p, "/tmp/model"))

              row = X.iloc[:1]
              payload = {
                  "parameters": {"content_type": "pd"},
                  "inputs": [
                      {"name": c, "shape": [1], "datatype": "FP64", "data": row[c].tolist()}
                      for c in row.columns
                  ],
              }
              print(json.dumps(payload))
              EOF
